[package]
name = "panelmc"
version = "0.2.1"
edition = "2021"
description = "Lightweight desktop Minecraft server panel"
license = "GPL-3.0-only"
repository = "https://github.com/Q9550xRX570/PanelMC"
homepage = "https://panelmc.com"
build = "build.rs"

[dependencies]
slint = "1.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"
getrandom = "0.2"

[build-dependencies]
slint-build = "1.8"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
incremental = false